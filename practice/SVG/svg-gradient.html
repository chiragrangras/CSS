<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient</title>
  </head>
  <body>
    <h1 style="text-align: center; color: orangered;">Linear Gradient</h1>
    <svg width="400" height="150">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </linearGradient>
      </defs>
      <ellipse cx="200" cy="70" rx="85" ry="55" fill="url(#grad1)" />
    </svg>

    <svg width="400" height="150">
      <defs>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </linearGradient>
      </defs>
      <ellipse cx="200" cy="70" rx="85" ry="55" fill="url(#grad2)" />
    </svg>

    <svg width="400" height="150">
      <defs>
        <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </linearGradient>
      </defs>
      <ellipse cx="200" cy="70" rx="85" ry="55" fill="url(#grad3)" />
      <text fill="#fff" font-size="30" x="170" y="80">Hello</text>
    </svg>
    

    <h1 style="text-align: center; color: orangered;">Radial Gradient</h1>
    <svg width="400" height="150">
      <defs>
        <radialGradient id="grad4" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="70" rx="85" ry="55" fill="url(#grad4)" />
    </svg>

    <svg width="400" height="150">
      <defs>
        <radialGradient id="grad5" cx="100%" cy="100%" r="50%" fx="0%" fy="0%">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="70" rx="85" ry="55" fill="url(#grad5)" />
    </svg>

    <svg width="400" height="150">
      <defs>
        <radialGradient id="grad6" cx="0%" cy="0%" r="50%" fx="50%" fy="50%">
          <stop offset="0%" stop-color="yellow" />
          <stop offset="100%" stop-color="red" />
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="70" rx="85" ry="55" fill="url(#grad6)" />
    </svg>

  </body>
</html>
