<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Circle, Ellipse and Rectangle</title>
  </head>
  <body>
    <!-- Circle -->
    <svg width="100" height="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="green"
        stroke-width="4"
        fill="red"
      />
    </svg>

    <!-- Ellipse -->
    <svg width="500" height="200">
      <ellipse
        cx="200"
        cy="80"
        rx="100"
        ry="50"
        style="fill: yellow; stroke: red; stroke-width: 2"
      />
    </svg>
    
    <!-- Rectangle -->
    <svg width="500" height="200">
        <rect width="300" height="100" stroke="green"
        stroke-width="4"
        fill="red">
    </svg>
  </body>
</html>
