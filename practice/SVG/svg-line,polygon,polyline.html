<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line,Polygon and Polyline</title>
</head>
<body>
    <!-- Line -->
     <svg width="500" height="210">
        <line x1="50" y1="50" x2="200" y2="50" style="stroke: blue; stroke-width:2"/>
     </svg>
     <!-- Polygon -->
      <svg width="500" height="210">
        <polygon points="200,10 250,190 160,210" style="fill:lightgreen; stroke:black; stroke-width:2"/>
      </svg>
     <!-- Polyline -->
      <svg width="500" height="210">
        <!-- <polyline points="200,10 250,190 160,210" style="fill:none; stroke:black; stroke-width:2"/> -->
        <polyline points="20,20 40,25 60,40 80,120 120,140 200,180" style="fill:none; stroke:black; stroke-width:2"/>
      </svg>
</body>
</html>
